# Centrale configuratie voor de AI Brand Engine.
# Pas dit aan; de scripts en workflows lezen hieruit.

brand:
  name: "VECTOR"                     # gekozen merknaam — wijzig vrij
  handle: "@vectorhq"                # voorkeurshandle (beschikbaarheid zelf checken)
  tagline: "Direction and momentum for the AI era."
  language: "en"                     # content-taal (Engels, wereldwijd)

posting:
  time_local: "17:00"                # dagelijkse posttijd (lokaal)
  timezone: "Europe/Amsterdam"       # cron in de workflow staat in UTC; zie comment daar
  cadence: "daily"                   # 1 post per dag
  # NB: de audit mag deze tijd bijstellen op basis van wat het best presteert.

budget:                              # zie COSTS.md voor de echte cijfers
  mode: "hybrid"                     # 3 video-dagen + 4 slideshow-dagen per week
  video_days: ["mon", "wed", "sun"]  # hero-videoclip (~45 credits)
  slideshow_days: ["tue", "thu", "fri", "sat"]  # carousel (~1-3 credits)
  est_monthly_credits: 620           # ruim binnen ~1789 saldo

pillars:                             # moet samen 100% zijn — audit kan dit bijstellen
  P1_ai_tool: 40
  P2_build_in_public: 25
  P3_wow_demo: 20
  P4_hot_take: 15

audit:
  day: "monday"
  output: "pull_request"             # "pull_request" | "issue" | "commit"

funnel:
  waitlist_url: ""                   # vul in zodra je landingspagina live is
